<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  body { margin: 0; padding: 0; background: #fbf7f0; color: #1d1a24; font-family: Georgia, "Times New Roman", serif; }
  .card { width: 100%; max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #ebe4d6; }
  .masthead { padding: 22px 36px; border-bottom: 3px solid #6123cc; font-family: Arial, Helvetica, sans-serif; }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #6123cc; margin: 0; }
  .stamp { font-size: 12px; color: #8a8273; margin: 4px 0 0; }
  .body { padding: 36px 36px 40px; }
  .kicker { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #b4571f; margin: 0 0 10px; }
  .title { font-size: 34px; line-height: 1.12; margin: 0 0 18px; color: #1d1a24; font-weight: 700; }
  .text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.7; margin: 0 0 24px; color: #4a4536; }
  .box { border-top: 1px solid #1d1a24; border-bottom: 1px solid #1d1a24; margin: 0 0 26px; }
  .box td { padding: 12px 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; border-bottom: 1px dotted #c9c1ae; }
  .box tr:last-child td { border-bottom: 0; }
  .k { color: #8a8273; width: 50%; }
  .v { color: #1d1a24; font-weight: 700; text-align: right; }
  .steps { margin: 0 0 26px; font-family: Arial, Helvetica, sans-serif; }
  .steps td { padding: 0 0 14px; vertical-align: top; font-size: 14px; line-height: 1.55; color: #4a4536; }
  .step-num { width: 42px; }
  .step-dot { font-family: Georgia, serif; font-size: 28px; font-style: italic; color: #6123cc; line-height: 1; }
  .total td { font-size: 17px; color: #6123cc; border-bottom: 0; padding-top: 16px; }
  .cta { margin: 0 0 26px; }
  .btn { display: inline-block; background: #1d1a24; color: #ffffff !important; text-decoration: none; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; padding: 15px 30px; }
  .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.6; color: #8a8273; margin: 0; }
  .footer { font-family: Arial, Helvetica, sans-serif; text-align: center; font-size: 11px; color: #8a8273; padding: 18px 0 0; }
  @media (max-width: 600px) { .body { padding: 26px 22px 30px; } .masthead { padding: 18px 22px; } .title { font-size: 28px; } }
</style>
</head>
<body>
<div style="display:none;max-height:0;overflow:hidden;">{{.Title}}</div>
<table role="presentation" cellpadding="0" cellspacing="0" width="100%">
  <tr><td align="center" style="padding: 28px 14px;">
    <table class="card" role="presentation" cellpadding="0" cellspacing="0">
      <tr><td class="masthead">
        <p class="brand">SOPHUS</p>
        <p class="stamp">{{.Edition}}</p>
      </td></tr>
      <tr><td class="body">
        <p class="kicker">{{.Kicker}}</p>
        <p class="title">{{.HeroTitle}}</p>
        {{.Content}}
      </td></tr>
    </table>
    <p class="footer">Sophus · Este é um email automático.</p>
  </td></tr>
</table>
</body>
</html>
